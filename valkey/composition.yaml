apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xvalkeycluster-ot-container-kit
  labels:
    provider: ot-container-kit
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: mimir.siliconsaga.org/v1alpha1
    kind: XValkeyCluster
  pipeline:
  - step: deploy-valkey
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ index .observed.composite.resource.metadata.labels "crossplane.io/claim-name" | default .observed.composite.resource.metadata.name }}-valkey
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: valkey-cluster
          spec:
            readiness:
              policy: DeriveFromCelQuery
              celQuery: "has(object.status.readyLeaderReplicas) && object.status.readyLeaderReplicas == 3"
            forProvider:
              manifest:
                apiVersion: redis.redis.opstreelabs.in/v1beta2
                kind: RedisCluster
                metadata:
                  name: {{ index .observed.composite.resource.metadata.labels "crossplane.io/claim-name" | default .observed.composite.resource.metadata.name }}
                  namespace: valkey
                spec:
                  clusterSize: {{ .observed.composite.resource.spec.parameters.replicas }}
                  kubernetesConfig:
                    image: valkey/valkey:8.0
                    imagePullPolicy: IfNotPresent
                    # Without these the pods are BestEffort, and BestEffort plus a
                    # health probe is a restart loop under contention: the four
                    # Valkey pods on this cluster accumulated 1296 restarts between
                    # them while each used under 10m. Sized from that measurement,
                    # with headroom rather than at the observed value.
                    resources:
                      requests:
                        cpu: 25m
                        memory: 64Mi
                      limits:
                        cpu: 250m
                        memory: 256Mi
                  redisExporter:
                    enabled: false
                    image: quay.io/opstree/redis-exporter:v1.44.0
                  storage:
                    volumeClaimTemplate:
                      spec:
                        accessModes: ["ReadWriteOnce"]
                        resources:
                          requests:
                            storage: {{ .observed.composite.resource.spec.parameters.storageSize }}

  - step: auto-ready
    functionRef:
      name: function-auto-ready
