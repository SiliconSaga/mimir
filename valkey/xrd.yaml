apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xvalkeyclusters.mimir.siliconsaga.org
spec:
  group: mimir.siliconsaga.org
  names:
    kind: XValkeyCluster
    plural: xvalkeyclusters
  # NOTE: the composition names the RedisCluster (and thus its leader Service)
  # after the claim, in the shared `valkey` namespace — so claim names must be
  # globally unique across the cluster. Two claims with the same name in
  # different namespaces would collide on one RedisCluster. This is the
  # trade-off that gives consumers a stable `<claim>-leader.valkey.svc` host.
  claimNames:
    kind: ValkeyCluster
    plural: valkeyclusters
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  replicas:
                    type: integer
                    default: 3
                    description: "Number of Valkey Nodes"
                  storageSize:
                    type: string
                    default: "1Gi"
                required:
                - replicas
            required:
            - parameters
          status:
            type: object
            properties:
              endpoint:
                type: string
                description: "Valkey Connection Address"
