apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mimir-strimzi
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://strimzi.io/charts/'
    chart: strimzi-kafka-operator
    targetRevision: 0.50.0
    helm:
      values: |
        watchAnyNamespace: true
        # Steady-state use is ~5m CPU / ~232Mi, so the 200m CPU request was ~40x
        # actual. Memory is left at the chart default because 232Mi of 384Mi is a
        # reasonable fit and the operator spikes while reconciling Kafka clusters.
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
