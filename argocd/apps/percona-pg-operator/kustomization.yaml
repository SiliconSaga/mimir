apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: pg-operator
    repo: https://percona.github.io/percona-helm-charts/
    version: 2.8.2
    releaseName: percona-postgresql-operator
    namespace: percona
    includeCRDs: true
    valuesInline:
      watchAllNamespaces: true
      # Chart default requests 100m/20Mi; measured use is ~8m CPU / ~76Mi, so the
      # memory request sat well below actual usage and made the operator an early
      # eviction candidate under node memory pressure.
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 500Mi

patches:
  - target:
      kind: Deployment
      name: percona-postgresql-operator-pg-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: false
