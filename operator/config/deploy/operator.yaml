# DataService operator deployment.
#
# Runs in the mimir namespace beside the shared clusters it administers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mimir-dataservice
  namespace: mimir
---
# The controller reads Secrets cluster-wide (admin credentials live in mimir,
# published credentials land in each consumer's namespace) and owns
# DataService objects. Generated rules are in config/rbac/role.yaml; this
# binds them cluster-wide because consumers live in arbitrary namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mimir-dataservice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mimir-dataservice
subjects:
  - kind: ServiceAccount
    name: mimir-dataservice
    namespace: mimir
---
# Leader election needs its own lease permissions in the operator's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mimir-dataservice-leader-election
  namespace: mimir
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mimir-dataservice-leader-election
  namespace: mimir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mimir-dataservice-leader-election
subjects:
  - kind: ServiceAccount
    name: mimir-dataservice
    namespace: mimir
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-dataservice
  namespace: mimir
  labels:
    app.kubernetes.io/name: mimir-dataservice
    app.kubernetes.io/part-of: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir-dataservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-dataservice
    spec:
      serviceAccountName: mimir-dataservice
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Kept in step with operator/VERSION, the tag CI publishes.
          #
          # Bump it for a behaviour change rather than republishing under the
          # same name. A swapped tag changes what the cluster runs while every
          # manifest still reads identically, so "is the fix deployed?" stops
          # being answerable from git at all.
          image: ghcr.io/siliconsaga/mimir-dataservice:0.3.0
          # Always, because the VERSION tag stays MUTABLE pre-1.0 — CI
          # republishes it for changes that do not earn a bump. The default for
          # a non-`latest` tag is IfNotPresent, which trusts whatever already
          # carries that name on the node.
          #
          # That is not theoretical. On the homelab this ran a seven-day-old
          # image from a local `docker build` that happened to use the same
          # tag: k3s under Rancher Desktop shares the workstation's image
          # store, so the local copy shadowed the registry entirely. The
          # symptom was an old binary against new RBAC — the operator kept
          # trying to watch Secrets cluster-wide, a permission removed days
          # earlier, and crash-looped on a cache it could never fill.
          imagePullPolicy: Always
          args:
            - --leader-elect
          env:
            # What consumers connect to: the pooler.
            - name: MIMIR_POSTGRES_HOST
              value: mimir-postgres-pgbouncer.mimir.svc
            - name: MIMIR_POSTGRES_PORT
              value: "5432"
            # Where DDL runs: the primary. CREATE DATABASE cannot run inside a
            # transaction block, and a pooler in transaction mode wraps every
            # statement in one — so this must NOT point at the pooler.
            - name: MIMIR_POSTGRES_ADMIN_HOST
              value: mimir-postgres-primary.mimir.svc
            - name: MIMIR_POSTGRES_ADMIN_PORT
              value: "5432"
            # Percona publishes superuser credentials here, keyed user/password.
            - name: MIMIR_POSTGRES_ADMIN_SECRET
              value: mimir/mimir-postgres-pguser-postgres
            - name: MIMIR_POSTGRES_ADMIN_DATABASE
              value: postgres
            # The cluster serves hostssl only; sslmode=disable is rejected
            # outright rather than downgraded.
            - name: MIMIR_POSTGRES_TLS
              value: "true"
            # pgBouncer does not verify passwords itself — it connects as this
            # role into the database the client asked for and runs an
            # auth_query there. Vended databases revoke CONNECT from PUBLIC,
            # which catches this role too, so each one has to admit it
            # explicitly or NOTHING can connect through MIMIR_POSTGRES_HOST.
            # Stated here rather than left to the built-in default because the
            # value is Percona-specific and worth being able to see.
            - name: MIMIR_POSTGRES_POOLER_AUTH_ROLE
              value: _crunchypgbouncer

            # MySQL is wired but NOT enabled — see shared/kustomization.yaml,
            # where the cluster itself is commented out for the same reason.
            # Uncomment both together. With HOST unset the engine reports
            # ClusterNotFound, which is a clearer answer than pointing at a
            # Service that does not exist and failing to connect.
            # - name: MIMIR_MYSQL_HOST
            #   value: mimir-mysql-haproxy.mimir.svc
            # - name: MIMIR_MYSQL_PORT
            #   value: "3306"
            # No ADMIN_HOST override: unlike Postgres, MySQL DDL is not
            # transactional, so HAProxy in front of the primary carries
            # CREATE DATABASE perfectly well and admin traffic can share the
            # consumer endpoint.
            #
            # The XtraDB operator's Secret is keyed BY USERNAME — root,
            # monitor, xtrabackup — with passwords as the values, so there is
            # no `user` key to read. The admin account is therefore given
            # literally, and the password key defaults to "root" to match.
            # - name: MIMIR_MYSQL_ADMIN_SECRET
            #   value: mimir/mimir-mysql-secrets
            # - name: MIMIR_MYSQL_ADMIN_USER
            #   value: root
            # - name: MIMIR_MYSQL_ADMIN_DATABASE
            #   value: mysql
            # PXC serves TLS by default.
            # - name: MIMIR_MYSQL_TLS
            #   value: "true"
          # Requests present from the start. An operator with a health probe
          # and no request is the restart loop this platform keeps rediscovering.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
