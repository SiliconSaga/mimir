# Strimzi resources are named from the CLAIM, not the composite.
#
# Crossplane derives a composite's name as <claim>-<random5>, so naming the
# Kafka cluster after the composite made it unpredictable and different after
# every teardown — `knarr-kafka-8r9tn` one time, `knarr-kafka-2wjjq` the next.
# Consumers cannot reference that: a KafkaTopic labelled with a cluster name
# that no longer exists is SILENTLY IGNORED by Strimzi, so a stale reference
# produces no topics and no error. Knarr shipped two committed files carrying
# a dead name for exactly this reason.
#
# spec.claimRef.name is stable for the life of the claim, so the cluster is now
# deterministically named and its bootstrap address is knowable in advance.
#
# CONSTRAINT this introduces: every Kafka cluster lands in the shared `kafka`
# namespace, so claim names must be unique ACROSS namespaces — two claims both
# called `events` in different namespaces would now collide where the random
# suffix used to hide it. Deliberate: one cluster per k8s cluster is the
# current expectation, and a predictable name is worth more than protection
# against a case that would itself be a naming mistake. Prefixing with the
# claim namespace would remove the constraint at the cost of every name.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xkafkacluster-strimzi
  labels:
    provider: strimzi
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: mimir.siliconsaga.org/v1alpha1
    kind: XKafkaCluster
  pipeline:
  - step: deploy-kafka
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.spec.claimRef.name }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-kafka
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: kafka-cluster
          spec:
            readiness:
              policy: DeriveFromCelQuery
              celQuery: "object.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
            forProvider:
              manifest:
                apiVersion: kafka.strimzi.io/v1beta2
                kind: Kafka
                metadata:
                  name: {{ $name }}
                  namespace: kafka
                  annotations:
                    strimzi.io/kraft: "enabled"
                    strimzi.io/node-pools: "enabled"
                spec:
                  kafka:
                    version: {{ .observed.composite.resource.spec.parameters.version | default "4.0.0" }}
                    listeners:
                    - name: plain
                      port: 9092
                      type: internal
                      tls: false
                    - name: tls
                      port: 9093
                      type: internal
                      tls: true
                    config:
                      offsets.topic.replication.factor: {{ min 3 .observed.composite.resource.spec.parameters.replicas }}
                      transaction.state.log.replication.factor: {{ min 3 .observed.composite.resource.spec.parameters.replicas }}
                      transaction.state.log.min.isr: {{ min 2 .observed.composite.resource.spec.parameters.replicas }}
                      default.replication.factor: {{ min 3 .observed.composite.resource.spec.parameters.replicas }}
                      min.insync.replicas: {{ min 2 .observed.composite.resource.spec.parameters.replicas }}
                  entityOperator:
                    topicOperator: {}
                    userOperator: {}
          ---
          # Publish the bootstrap address the XRD has always advertised. It was
          # declared in the XRD's status schema and never populated, so the
          # BOOTSTRAP printer column rendered empty and every consumer had to
          # reassemble the string by hand from a name it could not predict.
          # Reading it from status is now the supported way to find the cluster.
          apiVersion: {{ .observed.composite.resource.apiVersion }}
          kind: {{ .observed.composite.resource.kind }}
          status:
            bootstrapServers: {{ $name }}-kafka-bootstrap.kafka.svc.cluster.local:9092

  - step: deploy-kafka-node-pool
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $name := .observed.composite.resource.spec.claimRef.name }}
          apiVersion: kubernetes.crossplane.io/v1alpha2
          kind: Object
          metadata:
            name: {{ $name }}-nodepool
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: kafka-nodepool
          spec:
            readiness:
              policy: DeriveFromCelQuery
              celQuery: "object.status.replicas == {{ .observed.composite.resource.spec.parameters.replicas }}"
            forProvider:
              manifest:
                apiVersion: kafka.strimzi.io/v1beta2
                kind: KafkaNodePool
                metadata:
                  name: {{ $name }}-combined
                  namespace: kafka
                  labels:
                    strimzi.io/cluster: {{ $name }}
                spec:
                  replicas: {{ .observed.composite.resource.spec.parameters.replicas }}
                  roles:
                  - controller
                  - broker
                  storage:
                    type: persistent-claim
                    size: {{ .observed.composite.resource.spec.parameters.storageSize | default "10Gi" }}
                    deleteClaim: false
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "250m"
                    limits:
                      memory: "2Gi"
                      cpu: "1"

  - step: auto-ready
    functionRef:
      name: function-auto-ready

