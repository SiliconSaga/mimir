# Build and publish the DataService operator image.
#
# Path-filtered: Mimir holds far more than the operator, and a Composition edit
# should not rebuild a Go binary. Pull requests test but do not publish.
name: operator

on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - '.github/workflows/operator.yml'
  pull_request:
    paths:
      - 'operator/**'
      - '.github/workflows/operator.yml'
  workflow_dispatch:

# Read-only by default. `packages: write` is granted only to the job that
# publishes, so the job that runs repository code in go vet/test/run never
# holds a token that could push an image.
permissions:
  contents: read

defaults:
  run:
    working-directory: operator

jobs:
  test:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the integration tests. Tenant isolation is a
    # property of the server's grant model, not of our code, so asserting it
    # without a server would only be testing our own assumptions.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testadminpw
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # And a real MySQL, for the same reason. The MySQL provisioner's isolation
      # depends on escaping LIKE metacharacters in the GRANT, and whether that
      # escaping works is a fact about MySQL's grant matching rather than about
      # this code — its test carries a negative control that asserts the
      # UNESCAPED form really does leak, which needs a server to be meaningful.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testadminpw
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # No Git operation here needs the token, and leaving it in the
          # runner's git config exposes it to everything the tests execute.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: go vet
        run: go vet ./...

      # staticcheck catches the shape vet does not: an expression that cannot be
      # false. A test here compared a derived name against itself and asserted
      # nothing, and a human found it by reading the diff — SA4000 reports it.
      #
      # Run over BOTH build tags. The integration tests are where the
      # assertions live, and they are exactly the code the default build never
      # compiles. Pinned so a new release cannot fail a build nobody changed.
      #
      # Keep this version in step with scripts/lint.sh, and read the ceiling
      # note there before lowering it: a staticcheck predating the toolchain
      # cannot parse its export data, and fails with stdlib import errors rather
      # than saying so. CI is insulated because it takes Go from go.mod;
      # workstations on a newer toolchain are not.
      - name: staticcheck
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -tags integration ./...

      - name: go test
        run: go test ./... -count=1

      # Behind a build tag and skipped without MIMIR_TEST_PG / MIMIR_TEST_MYSQL,
      # so the plain `go test ./...` above stays hermetic.
      #
      # Both engines run in one step: each test skips itself when its own
      # variable is unset, so a single invocation covers whatever is configured
      # and stays correct if an engine is added or removed here.
      - name: integration tests
        env:
          MIMIR_TEST_PG: localhost:15432
          MIMIR_TEST_MYSQL: localhost:13306
        run: go test -tags integration ./internal/engine/... -count=1 -v

      # The Deployment pins a tag that this workflow is responsible for
      # publishing. If the two drift, ArgoCD syncs a tag nobody built and the
      # rollout fails with ImagePullBackOff long after the commit that caused
      # it — so catch the drift here instead.
      - name: image tag matches VERSION
        run: |
          version="$(cat VERSION)"
          pinned="$(grep -oP 'image: ghcr\.io/siliconsaga/mimir-dataservice:\K.*' config/deploy/operator.yaml)"
          echo "VERSION=$version  deployment=$pinned"
          test "$version" = "$pinned"

      # controller-gen output is committed so ArgoCD can apply it directly.
      # Regenerate and diff: a hand-edited CRD that no longer matches the Go
      # types is the failure mode this guards against.
      - name: generated manifests are current
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 \
            object paths=./api/v1alpha1/...
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 \
            crd:generateEmbeddedObjectMeta=false paths=./api/v1alpha1/... \
            output:crd:artifacts:config=config/crd
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5 \
            rbac:roleName=mimir-dataservice paths=./internal/controller/... \
            output:rbac:artifacts:config=config/rbac
          git diff --exit-code -- api config

  # Two jobs rather than one with a conditional permission.
  #
  # `permissions` accepts no expressions — a context there fails workflow
  # validation outright, in zero seconds, with no jobs and no error attached to
  # anything. So the split is the only way to give the pull-request path a
  # token that genuinely cannot publish, rather than one it merely does not use.
  build-pr:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # No login and no tags: this proves the Dockerfile still builds, nothing
      # more. A broken build fails in review instead of on merge.
      - uses: docker/build-push-action@v6
        with:
          context: operator
          push: false
          cache-from: type=gha

  publish:
    needs: test
    # Default branch AND not a pull request. The branch check is not redundant:
    # workflow_dispatch can target any branch, and `!= pull_request` alone would
    # let a dispatch from a feature branch republish the VERSION tag that the
    # operator Deployment pins — silently replacing what the cluster pulls with
    # unreviewed code.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: read version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # buildx with the docker-container driver is required for cache-to
      # type=gha; the default docker driver has no cache exporter.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/siliconsaga/mimir-dataservice
          # The sha tag is the immutable one. Pre-1.0 the version tag is
          # republished in place on every operator change, which is why the
          # sha exists: it is what to pin when a rollback has to be exact.
          tags: |
            type=sha,format=long
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
