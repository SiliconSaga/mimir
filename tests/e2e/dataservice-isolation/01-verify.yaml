# Three assertions, in order of how easy they are to get wrong:
#
#   1. tenant-a can use its OWN database          — the happy path
#   2. tenant-a CANNOT connect to tenant-b's      — the isolation claim
#   3. the published Secret's URI actually works  — the contract consumers use
#
# Assertion 2 is the one that matters. It is written as "the command must
# fail", which is easy to make pass accidentally — so it also greps for the
# specific permission-denied text rather than accepting any non-zero exit.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 180
commands:
  # 1. Own database is usable.
  - script: |
      set -euo pipefail
      NS="$NAMESPACE"
      URI=$(kubectl get secret tenant-a-dataservice -n "$NS" -o jsonpath='{.data.uri}' | base64 -d)

      kubectl run isolation-own --rm -i --restart=Never -n "$NS" \
        --image=postgres:15 --command -- \
        psql "$URI" -tAc "CREATE TABLE IF NOT EXISTS canary (v text); INSERT INTO canary VALUES ('hello'); SELECT v FROM canary LIMIT 1;" \
        | grep -q hello

      echo "ok: tenant-a can use its own database"

  # 2. THE ISOLATION ASSERTION. tenant-a's credentials must be refused by
  #    tenant-b's database. Without REVOKE CONNECT ... FROM PUBLIC this
  #    succeeds, and the shared cluster is shared data.
  - script: |
      set -euo pipefail
      NS="$NAMESPACE"
      A_USER=$(kubectl get secret tenant-a-dataservice -n "$NS" -o jsonpath='{.data.username}' | base64 -d)
      A_PASS=$(kubectl get secret tenant-a-dataservice -n "$NS" -o jsonpath='{.data.password}' | base64 -d)
      HOST=$(kubectl get secret tenant-a-dataservice -n "$NS" -o jsonpath='{.data.host}' | base64 -d)
      PORT=$(kubectl get secret tenant-a-dataservice -n "$NS" -o jsonpath='{.data.port}' | base64 -d)
      B_DB=$(kubectl get secret tenant-b-dataservice -n "$NS" -o jsonpath='{.data.database}' | base64 -d)

      CROSS="postgres://${A_USER}:${A_PASS}@${HOST}:${PORT}/${B_DB}?sslmode=require"

      set +e
      OUT=$(kubectl run isolation-cross --rm -i --restart=Never -n "$NS" \
        --image=postgres:15 --command -- \
        psql "$CROSS" -tAc "SELECT 1" 2>&1)
      RC=$?
      set -e

      if [ "$RC" -eq 0 ]; then
        echo "ISOLATION FAILURE: tenant-a connected to tenant-b's database" >&2
        echo "$OUT" >&2
        exit 1
      fi

      # Insist on the RIGHT failure. A typo in the host would also exit
      # non-zero and would otherwise look like a pass.
      if ! echo "$OUT" | grep -Eqi 'permission denied|not permitted|no pg_hba|authentication failed'; then
        echo "connection failed, but not for the expected reason:" >&2
        echo "$OUT" >&2
        exit 1
      fi

      echo "ok: tenant-a is refused by tenant-b's database"

  # 3. The published URI is what consumers are told to use, so it has to work
  #    verbatim rather than only after reassembly.
  - script: |
      set -euo pipefail
      NS="$NAMESPACE"
      URI=$(kubectl get secret tenant-b-dataservice -n "$NS" -o jsonpath='{.data.uri}' | base64 -d)

      kubectl run isolation-uri --rm -i --restart=Never -n "$NS" \
        --image=postgres:15 --command -- \
        psql "$URI" -tAc "SELECT current_database()" | grep -q tenant_b

      echo "ok: the published URI connects to the right database"
