# Four assertions, and the ORDER of them is the point.
#
#   1. tenant-a really uses its own database — write, then read back from a
#      SEPARATE pod, through the published URI
#   2. tenant-b's database is reachable over that same endpoint
#   3. tenant-a is refused by tenant-b's database
#   4. a tenant cannot read the pooler's password-lookup function
#
# Assertion 3 is the one the shared-cluster model rests on, and it is the one
# that is easy to pass for the wrong reason. It is written as "the command must
# fail", and plenty of things make a command fail. An earlier revision guarded
# that by insisting on `permission denied for database` specifically — which
# turned out not to be enough, because pgBouncer reports a FAILED PASSWORD
# LOOKUP with that same message. While the pooler could not authenticate anyone
# against any vended database, this test was green and nothing worked.
#
# Assertions 1 and 2 are what close that hole. They establish that this exact
# endpoint, with these exact credentials, reaches both databases. Only then
# does a refusal in assertion 3 mean isolation rather than breakage.
#
# Three mechanics, each of which has silently broken this test before:
#
#   * `sh` here is dash. `set -euo pipefail` is a bashism and aborts the whole
#     script with "Illegal option -o pipefail" before a single assertion runs —
#     which is exactly how the pooler bug survived. Only `set -eu`.
#   * No `cmd | grep -q`, ever. A pipeline's status is the LAST command's, so a
#     psql that died still reads as a pass.
#   * Success is not inferred from an exit status crossing the kubectl/pod
#     boundary. The container prints a MIMIR_OK sentinel and the script matches
#     on it, so a pod that never ran cannot be mistaken for one that passed.
#
# `psql -v ON_ERROR_STOP=1` is part of the same discipline: without it psql
# exits 0 after a statement that errored.
#
# Credentials reach the pods through `envFrom.secretRef`, never argv or a
# literal `--env`. Both of those put the plaintext into the Pod spec, where
# `kubectl describe pod` prints it back and the API server stores it. With
# envFrom the Secret's keys arrive as $host, $port, $database, $username,
# $password and $uri inside the container, and the manifest names only a
# Secret. SQL is not a credential, so it travels as a plain env var — which
# keeps the JSON free of nested quoting.
apiVersion: kuttl.dev/v1beta1
kind: TestStep
timeout: 300
commands:
  # Assertions 1 and 2: the positive controls.
  - script: |
      set -eu
      NS="$NAMESPACE"

      # run_psql <pod> <secret> <sql>
      #
      # Runs the statement against the database published in <secret>, through
      # that Secret's own URI — the pooler, which is what a consumer is handed.
      # Retries inside the container: a database can report Ready a moment
      # before the pooler will route to it, and a bare first attempt would make
      # this test flaky in exactly the way that erodes trust in it.
      run_psql() {
        overrides=$(printf '{"spec":{"containers":[{"name":"c","image":"postgres:15","envFrom":[{"secretRef":{"name":"%s"}}],"env":[{"name":"SQL","value":"%s"}],"command":["sh","-c","for i in $(seq 1 12); do OUT=$(psql \\"$uri\\" -v ON_ERROR_STOP=1 -tAc \\"$SQL\\"); if [ $? -eq 0 ]; then echo \\"MIMIR_OK:$OUT\\"; exit 0; fi; sleep 5; done; exit 1"]}]}}' "$2" "$3")
        kubectl run "$1" --rm -i --restart=Never -n "$NS" \
          --image=postgres:15 --overrides="$overrides" 2>&1
      }

      # 1a. A real tenant workload: a table and a row.
      OUT=$(run_psql isolation-write tenant-a-dataservice \
        'CREATE TABLE IF NOT EXISTS canary (v int); INSERT INTO canary VALUES (42);' || true)
      case "$OUT" in
        *MIMIR_OK:*) ;;
        *)
          echo "tenant-a could not write to its own database through the published URI:" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac
      echo "ok: tenant-a created a table and wrote a row through the published URI"

      # 1b. Read it back from a DIFFERENT pod. A single session would only
      #     prove the connection worked, not that anything was stored.
      OUT=$(run_psql isolation-read tenant-a-dataservice 'SELECT v FROM canary;' || true)
      case "$OUT" in
        *MIMIR_OK:42*) ;;
        *)
          echo "tenant-a could not read back the row it just wrote:" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac
      echo "ok: a second pod read the row back — the database persists tenant data"

      # 2. The positive control for the isolation assertion below. Without it,
      #    a refusal there could equally mean tenant-b is unreachable by
      #    ANYONE — which is precisely the failure that hid here before.
      B_DB=$(kubectl get secret tenant-b-dataservice -n "$NS" -o jsonpath='{.data.database}' | base64 -d)
      if [ -z "$B_DB" ]; then
        echo "tenant-b's Secret has no database name" >&2
        exit 1
      fi
      OUT=$(run_psql isolation-b-own tenant-b-dataservice 'SELECT current_database();' || true)
      case "$OUT" in
        *"MIMIR_OK:$B_DB"*) ;;
        *)
          echo "tenant-b cannot reach its own database, so a refusal below would prove nothing:" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac
      echo "ok: tenant-b's database is reachable over the same endpoint"

  # Assertion 3: THE ISOLATION ASSERTION. tenant-a's credentials against
  # tenant-b's database name, over the endpoint both tenants just used.
  - script: |
      set -eu
      NS="$NAMESPACE"
      B_DB=$(kubectl get secret tenant-b-dataservice -n "$NS" -o jsonpath='{.data.database}' | base64 -d)
      if [ -z "$B_DB" ]; then
        echo "tenant-b's Secret has no database name" >&2
        exit 1
      fi

      # Only tenant-b's DATABASE NAME is passed as a literal — it is not a
      # credential. tenant-a's password arrives via envFrom, and $host and
      # $port come from tenant-a's own Secret, so this is the very endpoint the
      # assertions above just proved reachable for both tenants.
      #
      # No retry loop here: this is expected to fail, and retrying a failure
      # only makes the step slower.
      OVERRIDES=$(printf '{"spec":{"containers":[{"name":"c","image":"postgres:15","envFrom":[{"secretRef":{"name":"tenant-a-dataservice"}}],"env":[{"name":"TARGET_DB","value":"%s"}],"command":["sh","-c","PGPASSWORD=$password PGSSLMODE=require psql -h $host -p $port -U $username -d $TARGET_DB -v ON_ERROR_STOP=1 -tAc \\"SELECT 1\\" && echo MIMIR_CONNECTED"]}]}}' "$B_DB")

      set +e
      OUT=$(kubectl run isolation-cross --rm -i --restart=Never -n "$NS" \
        --image=postgres:15 --overrides="$OVERRIDES" 2>&1)
      RC=$?
      set -e

      # Two independent signals, because either one alone has failed us: the
      # exit status has to cross the kubectl/pod boundary intact, and the
      # sentinel only appears if psql actually returned rows.
      case "$OUT" in
        *MIMIR_CONNECTED*)
          echo "ISOLATION FAILURE: tenant-a connected to tenant-b's database" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac
      if [ "$RC" -eq 0 ]; then
        echo "ISOLATION FAILURE: tenant-a's connection to tenant-b's database exited 0" >&2
        echo "$OUT" >&2
        exit 1
      fi

      # Insist on an AUTHORIZATION refusal specifically. "authentication
      # failed" or "no pg_hba entry" would be too generous: a wrong password or
      # a pg_hba misconfiguration produces those and would pass while proving
      # nothing about REVOKE CONNECT. A typo in the host exits non-zero too.
      case "$OUT" in
        *"permission denied for database"*) ;;
        *"does not have CONNECT privilege"*) ;;
        *)
          echo "the connection failed, but not by the grant model:" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac

      echo "ok: tenant-a is refused by tenant-b's database, over an endpoint proven to work"

  # Assertion 4: the pooler's password-lookup function lives inside every
  # tenant's own database and returns the stored verifier for any login role on
  # the cluster. If a tenant could call it, the fix that made the pooler work
  # would have handed every tenant every other tenant's credentials — a worse
  # leak than the isolation this operator exists to provide.
  - script: |
      set -eu
      NS="$NAMESPACE"

      OVERRIDES='{"spec":{"containers":[{"name":"c","image":"postgres:15","envFrom":[{"secretRef":{"name":"tenant-a-dataservice"}}],"env":[{"name":"SQL","value":"SELECT password FROM pgbouncer.get_auth(current_user);"}],"command":["sh","-c","psql \"$uri\" -v ON_ERROR_STOP=1 -tAc \"$SQL\" && echo MIMIR_READ_VERIFIER"]}]}}'

      set +e
      OUT=$(kubectl run isolation-getauth --rm -i --restart=Never -n "$NS" \
        --image=postgres:15 --overrides="$OVERRIDES" 2>&1)
      RC=$?
      set -e

      case "$OUT" in
        *MIMIR_READ_VERIFIER*)
          echo "PRIVILEGE LEAK: a tenant read password verifiers through pgbouncer.get_auth" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac
      if [ "$RC" -eq 0 ]; then
        echo "PRIVILEGE LEAK: a tenant's call to pgbouncer.get_auth exited 0" >&2
        echo "$OUT" >&2
        exit 1
      fi

      case "$OUT" in
        *"permission denied"*) ;;
        *)
          echo "the lookup was refused, but not by the grant model:" >&2
          echo "$OUT" >&2
          exit 1
          ;;
      esac

      echo "ok: the pooler's password lookup is not reachable by tenants"
