# The shared PostgreSQL cluster.
#
# One cluster, many databases — vended by the DataService operator rather than
# by a claim per app. See docs/plans/2026-08-17-dataservice-vending-design.md.
#
# Declared as a plain manifest rather than composed from a claim: it is
# infrastructure the platform owns, not something an app requests. A claim
# would imply it could be provisioned more than once, which is exactly the
# cluster-per-app model this replaces.
apiVersion: pgv2.percona.com/v2
kind: PerconaPGCluster
metadata:
  name: mimir-postgres
  namespace: mimir
spec:
  # NOTE: this file is REALM-NEUTRAL and must stay that way. It is the shape
  # every cluster gets — one local repo and no cloud dependency — and realms add
  # to it from shared/overlays/<realm>. The GKE Workload Identity annotation and
  # the repo2 GCS repository live in overlays/gke; see the header there for the
  # two-KSA binding trap they carry with them.
  #
  # ⚠ WHY NEUTRAL IS THE DEFAULT, NOT A PREFERENCE. Until 2026-11-03 this file
  # was GKE-shaped and was applied verbatim to every realm, so on homelab
  # pgBackRest spent 33 days trying to reach `metadata.google.internal` to
  # authenticate to a GCS bucket that realm has no path to. Postgres may not
  # recycle a WAL segment until EVERY configured repo accepts it, so an 85MB
  # database accumulated 96.5GB of pg_wal and came within about a day of filling
  # the host disk. A realm that cannot reach a repo must never be given one.
  image: "percona/percona-postgresql-operator:2.7.0-ppg15-postgres"
  imagePullPolicy: Always
  # Pinned at 15 to match every existing cluster, so the eventual rebuild of
  # keycloak/ting/harbor onto this one is not also a major-version migration.
  # A shared cluster serves one version for all tenants, which is why
  # spec.version on a DataService is rejected under placement: shared.
  postgresVersion: 15

  instances:
    - name: instance1
      # SINGLE INSTANCE, and that is a stated limitation rather than an
      # oversight: this cluster is a single point of failure for every tenant
      # on it, which is strictly worse than the per-app clusters it replaces,
      # where one failure cost one app.
      #
      # Deliberate for now. This platform is actively being de-contended and a
      # standby would roughly double the reservation, so the trade is taken
      # knowingly and written down. Raising this to 2 with a PodDisruptionBudget
      # is the fix, and it belongs with the offsite-backup work below — both are
      # prerequisites before anything load-bearing depends on this cluster.
      replicas: 1
      # Sized for the sum of its tenants plus connection overhead, not for one
      # of the clusters it replaces. Measured p95 of the three existing
      # single-tenant clusters: keycloak 77m/418Mi, ting 70m/336Mi,
      # harbor 60m/487Mi. Forgejo is the fourth.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # 10Gi, and this number is load-bearing: it is the input to the
            # backup repository sizing below, so the two cannot be changed
            # independently. Twenty times current usage — Ting and Keycloak are
            # both under 500Mi — and standard-rwo supports volume expansion, so
            # growing later is a one-line change rather than a migration.
            storage: 10Gi
      initContainer:
        image: percona/percona-postgresql-operator:2.7.0
        containerSecurityContext:
          runAsNonRoot: false

  backups:
    enabled: true
    # Off: nothing here reads latestRestorableTime, and point-in-time restore
    # works without it — it is a status convenience, and on operator 2.x it is
    # an expensive one.
    #
    # On, a WAL watcher stamps the newest commit timestamp every 10s, and a 2.x
    # bug (K8SPG-1113, fixed in 3.1.0) spreads that stamp to EVERY Succeeded
    # PerconaPGBackup. Each status change re-queues its backup, and each
    # reconcile execs `pgbackrest info` into the primary. With WAL archived
    # every minute the loop never settles, and its cost scales with the number
    # of backup CRs: at 36 it held the primary at ~0.7 cores of its 1-core
    # limit, throttled the pod, and starved the pgBackRest sidecar's 1s
    # liveness probe into 63 restarts. Turning this off stopped the loop within
    # four minutes, and the primary dropped to ~0.07 cores.
    #
    # Anything that still touches every backup (an operator restart, a resync)
    # pays one exec pair per CR, which is why retention below is kept tight:
    # the operator deletes a CR once pgBackRest expires its backup.
    trackLatestRestorableTime: false
    pgbackrest:
      # pgBackRest ships in its OWN repository, not as a suffixed tag on the
      # operator repo. This previously pointed at the PostgreSQL *server*
      # image, which the repo-host would have run instead of pgBackRest —
      # accepted by the API, then failing at backup time, which is the least
      # visible failure this cluster can have.
      #
      # Verified against Docker Hub: percona/percona-postgresql-operator has no
      # pgbackrest tag at 2.7.0 at all (only 2.6.0-ppg17 ones), while
      # percona/percona-pgbackrest:2.55.0 was published in the same week as the
      # 2.7.0 server images.
      image: "percona/percona-pgbackrest:2.55.0"
      # Requests here for the same reason as everywhere else on this cluster:
      # BestEffort plus a health probe is a restart loop under contention, and
      # this is the pod holding the backups.
      repoHost:
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
      # Retention, derived from the repository size rather than picked as a
      # round number. Without any retention pgBackRest keeps every full backup
      # until the volume fills, at which point backups start failing — the
      # failure mode that stays invisible until a restore is attempted.
      #
      # Deliberately few. Each retained backup is also a PerconaPGBackup CR the
      # operator reconciles with an exec into the primary (see
      # trackLatestRestorableTime above), so retention is a CPU budget as well
      # as a disk budget.
      #
      # Differentials are capped separately. Point-in-time recovery reaches
      # back to the oldest retained full either way, because archived WAL is
      # kept for as long as that full is; older diffs only make a restore to
      # an older point faster, which is not worth a CR apiece.
      #
      # repo1 is the fast local restore: this week's full plus the latest diff,
      # so point-in-time recovery reaches back 0–7 days locally. A second local
      # full adds nothing repo2 does not already hold. One diff, not more,
      # because the volume below is sized for it.
      global:
        repo1-retention-full: "1"
        repo1-retention-full-type: count
        repo1-retention-diff: "1"
        # ── THE DEAD-MAN SWITCH ───────────────────────────────────────────────
        # Everything else in this file assumes archiving works. This pair is
        # what happens when it does not, and it is the single most important
        # setting here.
        #
        # Postgres may not recycle a WAL segment until every configured repo has
        # accepted it, so a repo that is merely UNREACHABLE — a broken endpoint,
        # expired credentials, a realm with no route to the bucket — is not a
        # degraded backup. It is unbounded growth in pg_wal, on the data volume,
        # at the database's full write rate, until the disk is gone and Postgres
        # stops. pgBackRest's own documentation is blunt about the trade: better
        # to lose the backup than have PostgreSQL go down.
        #
        # Past this threshold pgBackRest tells Postgres the segment was archived,
        # drops it, and warns in the Postgres log. That LOSES POINT-IN-TIME
        # RECOVERY CONTINUITY — the archive gains a hole, a restore through it
        # will fail, and getting the guarantee back needs a fresh full backup.
        #
        # ⚠ NOTHING ALERTS ON THAT YET. The Postgres log warning notifies nobody,
        # so this is a cliff chosen knowingly rather than a monitored one. It is
        # still the right trade — an unnoticed archive gap is strictly less
        # damage than an unnoticed outage that takes every tenant on this cluster
        # down — but do not read it as a safety net that reports itself.
        #
        # The detection belongs in heimdall and is the next change. Note why it
        # is not a one-liner there: on local-path, kubelet reports the NODE
        # filesystem as a volume's capacity, so the PVC-fill rules that should
        # have caught the original 96.5GB measured ~18% full and never fired.
        #
        # 2GiB against a 10Gi data volume: a fifth of the volume, so there is
        # room for the database itself and for the gap to be noticed, and small
        # enough to matter on a node whose storage class enforces no quota at all
        # (local-path reports the NODE filesystem as the volume's capacity, so
        # nothing below the node level can see this volume fill).
        archive-push-queue-max: 2GiB
        # ⚠ A BACKSTOP, NOT AN EXACT CEILING, and deliberately left loose.
        # The queue is only measured at the START of each asynchronous run, so
        # it can grow past 2GiB by whatever arrives before the next recheck.
        # pgBackRest's own lever for tightening that, `archive-push-batch-size`,
        # DOES NOT EXIST BEFORE 2.59.0 — and the image pinned above is 2.55.0,
        # where an unrecognised option makes pgBackRest reject its entire
        # configuration and archive nothing. Setting it here would have broken
        # archiving outright, which is the failure this whole file exists to
        # prevent. If that image is ever bumped, note the option takes a SIZE
        # (minimum 1MiB, rounded down to whole WAL segments), never a segment
        # count. At this cluster's observed ~125MB/hour the overshoot between
        # rechecks is small, so the loose bound still does its job.
      repos:
        - name: repo1
          # Schedules are not optional here. pgBackRest takes an initial backup
          # when the cluster is created and then, with no schedule, never takes
          # another — so the repo would sit holding one increasingly stale copy
          # while looking healthy.
          schedules:
            full: "0 1 * * 0"
            differential: "0 1 * * 1-6"
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  # Derived, not guessed — and the peak is RETENTION PLUS ONE.
                  # pgBackRest cannot expire the oldest retained full until its
                  # replacement has completed successfully, so the moment before
                  # expiry the repo holds two fulls, not one, plus the retained
                  # diff. A diff can be as large as a full when every page has
                  # changed, so it is budgeted as one:
                  #
                  #   (1 retained + 1 in flight) x 10Gi = 20Gi   zero compression
                  #   + 1 retained diff at full size      = 10Gi
                  #   + WAL                                ~10Gi headroom
                  #   -------------------------------------------------------
                  #                                               40Gi
                  #
                  # This is also why repo1 keeps one diff: each extra one is
                  # another 10Gi at worst.
                  #
                  # Deliberately sized for INCOMPRESSIBLE data. pgBackRest
                  # compresses, and real Postgres content compresses well, but a
                  # retention promise that only holds for compressible tenants
                  # is one that fails on the tenant who stores encrypted blobs —
                  # and it fails by silently dropping backups, which is the
                  # least visible failure this platform can have.
                  #
                  # An earlier revision paired 4 fulls with a 20Gi repo against a
                  # 20Gi data volume, which could not hold even one worst-case
                  # full. Change data size, retention and this number together.
                  storage: 40Gi
        # ── repo1 IS THE ONLY REPO HERE, AND THAT IS THE POINT ──
        # It is a local PVC: it survives a pod restart, but not the loss of the
        # cluster or the host. Consolidating every tenant onto one shared
        # Postgres concentrates that exposure — what used to cost one app its
        # database now costs all of them — so a realm that can reach offsite
        # storage SHOULD add a second repo, in its own overlay.
        #
        # overlays/gke appends repo2 against GCS. Homelab realms deliberately
        # have none, which is a STATED GAP rather than an oversight: there is no
        # object store reachable from every homelab cluster (Garage is in-cluster,
        # so it does not survive the case repo2 exists for), and a repo pointed
        # somewhere unreachable is worse than no repo at all — see the dead-man
        # switch above for what that actually cost. Giving homelab a real offsite
        # target is a deliberate decision with a bucket and credentials behind
        # it, not a line added here.

  proxy:
    pgBouncer:
      replicas: 1
      # Not flagged in review, found while verifying the pgBackRest image
      # above: this was an operator-2.6.0 artifact under a 2.7.0 operator. The
      # tag exists and would pull, so the skew was invisible.
      #
      # Same pgBouncer version as before (1.24.0, per the 2.6.0-ppg15.12-
      # pgbouncer1.24.0 tag it came from), moved to the standalone repository
      # where Percona publishes it from 2.7.0 onward.
      image: "percona/percona-pgbouncer:1.24.0"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi

  users:
    # The superuser the operator authenticates as to create databases and
    # roles. Percona publishes its credentials to a Secret named
    # <cluster>-pguser-<name>, which is what MIMIR_POSTGRES_ADMIN_SECRET points
    # at. Tenant databases are NOT declared here — that is the operator's job,
    # and listing them here is the shared-array contention the design rejected.
    - name: postgres
      databases:
        - postgres
