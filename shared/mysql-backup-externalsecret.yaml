# HMAC credentials for the shared MySQL cluster's off-site backups.
#
# WHY A STATIC CREDENTIAL AT ALL, when the Postgres cluster next door reaches
# GCS keylessly: the PXC operator supports exactly three backup storage types —
# `filesystem`, `s3`, `azure`. There is no native GCS, unlike the Percona
# Postgres operator's `gcs:` repo with `gcs-key-type: auto`. Reaching GCS from
# PXC therefore means the S3-interoperability endpoint, and that authenticates
# with HMAC keys, which Workload Identity cannot issue. This is the one place on
# the platform that genuinely cannot be keyless — recorded so nobody "fixes" it
# back to a GSA annotation and wonders why xbcloud 403s.
#
# Blast radius is bounded deliberately: the GSA behind this key
# (mysql-backup@teralivekubernetes.iam.gserviceaccount.com) holds
# roles/storage.objectAdmin on gs://teralivekubernetes-mysql-backups and NOTHING
# else — not project-wide, not on the Velero or pgBackRest buckets.
#
# Key names are fixed by the operator, not chosen: PXC reads exactly
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY out of `credentialsSecret`,
# whatever the actual object store is. See deploy/backup/backup-secret-s3.yaml
# upstream. They are AWS-shaped names holding Google HMAC values.
#
# Source of truth is OpenBao at secret/mimir-mysql-backup. A recovery copy also
# lives in the workspace .env, because OpenBao runs the manual Shamir seal
# posture on GKE (verified 2026-09-15: `bao status` reports Seal Type shamir,
# NOT auto-unseal) — so a pod restart leaves it sealed until a human submits two
# shares. While sealed, this ExternalSecret cannot refresh; the already-
# materialized Secret keeps working (deletionPolicy Retain), so running backups
# survive a seal. What does not survive is needing to RECREATE the Secret while
# sealed. That is what the .env copy is for.
#
# Fields that ESO's CRD merely defaults are spelled out explicitly, the same
# reason nidavellir's demo ExternalSecret does it: the API server applies schema
# defaults at admission, so an omitted-but-defaulted field comes back populated
# and ArgoCD then reports permanent OutOfSync drift on an app with selfHeal on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mimir-mysql-backup-s3
  namespace: mimir
  labels:
    app.kubernetes.io/part-of: mimir
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-kv
    kind: ClusterSecretStore
  target:
    name: mimir-mysql-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: secret/mimir-mysql-backup
        property: AWS_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: secret/mimir-mysql-backup
        property: AWS_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
