# The platform's shared data clusters — the servers that DataService vends
# databases out of.
#
# Separate from the operator so that pruning one can never delete the other.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - postgres-cluster.yaml
  # ENABLED 2026-09-06, with the matching MIMIR_MYSQL_* block in
  # operator/config/deploy/operator.yaml — the two only ever move together.
  #
  # The single-node caveat below is accepted knowingly rather than resolved:
  # this is still ONE PXC node with allowUnsafeConfigurations, so no Galera
  # quorum and no failover for any tenant on it. Its first tenant is XenForo,
  # which is being stood up empty, so the exposure is a forum that can be
  # rebuilt rather than data that cannot. Raising pxc.size to 3 and adding the
  # offsite backup storage are both still prerequisites before anything
  # load-bearing lands here — see the comments in mysql-cluster.yaml.
  - mysql-cluster.yaml
