# The shared MySQL cluster.
#
# One cluster, many databases — vended by the DataService operator rather than
# by a claim per app. See docs/plans/2026-08-17-dataservice-vending-design.md.
#
# Declared as a plain manifest for the same reason as the Postgres cluster: it
# is infrastructure the platform owns, not something an app requests. A claim
# would imply it could be provisioned more than once, which is exactly the
# cluster-per-app model this replaces.
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: mimir-mysql
  namespace: mimir
spec:
  crVersion: 1.19.0
  # Required for pxc.size: 1. Galera is quorum-based and a one-node "cluster"
  # has no quorum, so the operator refuses the configuration without this flag.
  # See the size comment below for why the trade is taken deliberately.
  allowUnsafeConfigurations: true
  # The operator generates this Secret and keys it BY USERNAME — root, monitor,
  # xtrabackup — rather than carrying `user`/`password` the way Percona's
  # Postgres operator does. That is why the operator is pointed at it with
  # MIMIR_MYSQL_ADMIN_USER=root and ADMIN_PASSWORD_KEY defaulting to "root".
  secretsName: mimir-mysql-secrets

  pxc:
    # SINGLE NODE, and a stated limitation rather than an oversight — the same
    # trade the shared Postgres cluster documents, and slightly sharper here:
    # this is a single point of failure for every tenant on it, which is worse
    # than the per-app clusters it replaces, where one failure cost one app.
    # It also means the Galera replication that is PXC's entire reason for
    # existing is not actually doing anything yet.
    #
    # Deliberate for now, on a platform being actively de-contended. Raising to
    # 3 (Galera wants an odd number for quorum) is the fix, and it belongs with
    # the offsite-backup work below — both are prerequisites before anything
    # load-bearing depends on this cluster. Budget for it: three PXC nodes plus
    # HAProxy is roughly 4GB against this one's ~1.3GB.
    size: 1
    image: percona/percona-xtradb-cluster:8.0.44-35.1
    # Sized for the sum of its tenants plus connection overhead, in the same
    # spirit as the Postgres cluster. Deliberately not BestEffort: a pod with a
    # liveness probe and no requests is a restart loop under contention, and
    # this one holds every tenant's data.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Matches the Postgres cluster's 10Gi for the same reasoning: well
            # above current usage, and expandable on the storage classes this
            # platform runs, so growing later is a one-line change rather than
            # a migration.
            storage: 10Gi
    # No storageClassName, per the repo-wide rule: the cluster default is
    # local-path on k3d, standard-rwo on GKE, Longhorn on homelab.

  haproxy:
    # The consumer endpoint. MIMIR_MYSQL_HOST points here while
    # MIMIR_MYSQL_ADMIN_HOST may point at the same place — unlike Postgres,
    # MySQL DDL is not transactional, so there is no pooler-in-transaction-mode
    # problem forcing admin traffic to the primary.
    enabled: true
    size: 1
    image: percona/haproxy:2.8.17
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  backup:
    # ⚠ The backup image does NOT live in the operator's repo, and assuming it
    # did is what broke every backup this cluster ever attempted.
    #
    # `percona-xtradb-cluster-operator:1.19.0-pxc8.0-backup-pxb8.0.35` was
    # written by pattern-matching the operator version. No such tag exists —
    # that repo's backup variants stop at 1.17.0. The first correction pinned
    # 1.17.0 there; it pulled, then failed differently, and that second failure
    # is the one worth carrying forward:
    #
    #     garbd: FATAL: unrecognised option '--extended-exit-codes'
    #
    # THE BACKUP POD IS BUILT FROM TWO IMAGES. An init container from the
    # OPERATOR image — 1.19.0, and NOT settable here — copies /opt/percona/backup/
    # into the pod, run_backup.sh included. That script then drives the binaries
    # from the image named below. Pin an old backup image and you get a new
    # script calling flags an old garbd never had. The backup image is not free
    # to lag the operator; it has to track it.
    #
    # Percona moved these images to the standalone `percona/percona-xtrabackup`
    # repo as of operator 1.18.0 — which is why the operator repo looks like it
    # simply stopped publishing them.
    #
    # ★ GET THE PAIRING FROM UPSTREAM, DO NOT INFER IT FROM THE TAGS. The tag
    # suffixes are independent release counters, NOT a shared train: server
    # 8.0.44-35.1 pairs with backup 8.0.35-34.1, and the matching `-35.1` on
    # both sides of an earlier guess here was a coincidence that read like a
    # rule. The operator publishes the tested set per release, one file:
    #
    #     https://raw.githubusercontent.com/percona/percona-xtradb-cluster-operator/v1.19.0/e2e-tests/release_versions
    #
    # At v1.19.0 that file reads IMAGE_PXC80=percona-xtradb-cluster:8.0.44-35.1
    # (exactly the server above) and IMAGE_BACKUP80=percona-xtrabackup:8.0.35-34.1.
    # Bump both together from that file, at the tag matching crVersion.
    #
    # ✓ RESOLVED: the "xtrabackup 8.0.35 vs server 8.0.44" skew flagged here
    # earlier was a misreading. 8.0.35 is PXB's frozen base-MySQL version, not a
    # lag behind the server, and Percona publishes no other 8.0-series build.
    image: percona/percona-xtrabackup:8.0.35-34.1
    storages:
      # ── gcs: object storage, and the ONLY storage defined here ──
      # `filesystem` was removed rather than kept alongside this, which is a
      # departure from the Postgres cluster's repo1-local + repo2-offsite shape
      # next door. The reason is mechanical, not stylistic: pgBackRest reuses ONE
      # volume and rotates retention inside it, so a local repo costs a fixed
      # 40Gi. PXC's `filesystem` provisions a NEW PVC PER RUN and `keep:` prunes
      # only successful backups, so a local tier here is a disk leak with a
      # retention setting painted on it. That is not a hypothetical — it reached
      # 320Gi of orphans and took the regional SSD quota to 976 of 1000. There is
      # no safe way to keep a local tier on this operator, so there isn't one.
      #
      # ⚠ THIS IS GCS, REACHED OVER ITS S3-COMPATIBLE ENDPOINT, and that is not a
      # workaround anyone should undo. The PXC operator supports exactly three
      # storage types — filesystem, s3, azure. It has NO native GCS, unlike the
      # Percona Postgres operator's `gcs:` repo with `gcs-key-type: auto` that
      # postgres-cluster.yaml uses. So this is the one backup path on the
      # platform that CANNOT use keyless Workload Identity: the S3 interop API
      # authenticates with HMAC keys, which WI cannot issue. Replacing the
      # credentialsSecret with a GSA annotation will 403 in xbcloud.
      gcs:
        type: s3
        # Explicit rather than relying on the default, because a silent `false`
        # here would put HMAC credentials on the wire unverified.
        verifyTLS: true
        s3:
          bucket: teralivekubernetes-mysql-backups
          # The S3-compatible front door for GCS. Without this, xbcloud talks to
          # real AWS and fails in a way that reads like a credentials problem.
          endpointUrl: https://storage.googleapis.com
          # Matches the bucket's location. GCS ignores the S3 region for routing,
          # but xbcloud signs the request with it, so a mismatch is a signature
          # error rather than a helpful message.
          region: us-east1
          # HMAC key, materialized by ESO from OpenBao — see
          # mysql-backup-externalsecret.yaml for why it is static, how narrowly
          # the GSA is scoped, and the .env recovery copy. The operator requires
          # the keys to be named AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          # regardless of which object store is behind them.
          credentialsSecret: mimir-mysql-backup-s3

  # ── SCHEDULE RE-ENABLED 2026-09-16, after being off since 2026-09-14 ──
  #
  # Re-enabled only once a backup was proven against the storage it will
  # actually use: `gcs-verify-1` reached Succeeded on 2026-09-16 AND its objects
  # were confirmed in the bucket — 1,203,090,161 bytes under
  # mimir-mysql-2026-09-16-19:14:20-full/, within ~9 KB of the 1.1G local stream
  # verified the day before, with no per-run PVC created. `Succeeded` without
  # objects in the bucket is the failure shape to keep checking for:
  #     gcloud storage ls -r gs://teralivekubernetes-mysql-backups
  #
  # 02:00 sits between pgBackRest repo1 (01:00) and repo2 (03:00), ahead of the
  # XenForo dump (03:20) and Velero (06:00), so no two backups share a slot on a
  # cluster already tight on CPU requests. keep: 7 is a week of dailies; in GCS
  # `keep` prunes objects, not disks, and ~1.1G a day costs cents.
  #
  # The history below stays because it explains the storage and image choices
  # above, and the debugging order for the next failure.
  #
  # WHAT HAPPENED: it ran daily from 09-07 to 09-14 and EVERY run failed on the
  # bad image tag above, never starting xtrabackup at all. Each attempt still
  # provisioned its 40Gi PVC first, and `keep: 3` prunes successful backups, not
  # failed ones — so eight orphans reached 320Gi and took the regional
  # SSD_TOTAL_GB quota to 976 of 1000. Past that nothing cluster-wide could
  # provision a disk, and Velero surfaced it by going PartiallyFailed on the
  # PVCs that could no longer bind. Worse than no backup: nothing restorable,
  # and it consumed the quota everything else needed.
  #
  # ★ THE STATUS LIED, AND THAT IS THE DURABLE LESSON. The backup CR reported
  # "running deadline seconds exceeded", which reads as xtrabackup being slow on
  # a large dataset. It is really the operator timing out a job whose container
  # never pulled. Nothing in the CR, and nothing in the operator log a day
  # later, names the image. The cause is only visible in the backup POD's events
  # while it exists:
  #     kubectl -n mimir get pods -l percona.com/backup-name=<backup>
  #     kubectl -n mimir describe pod <that pod>
  #     kubectl -n mimir logs <that pod>
  # Do that first for any failing backup here, before tuning anything. The CR
  # sat at state=Running through the garbd failure too, while the pod behind it
  # crash-looped — the CR state is not a verdict, the pod is. And the second
  # failure was only ever visible in the pod's LOGS, not its events, so read
  # both.
  #
  # BEFORE RE-ENABLING — BOTH, not either:
  #   1. ✓ DONE 2026-09-15 — see the note at the top of this block. Do not take
  #      state=Succeeded on its own, given the above: mount the destination PVC
  #      read-only and confirm the artifact is really there.
  #   2. ✓ DONE 2026-09-15 — `filesystem` is gone, storage is `s3` against GCS.
  #      Kept in full below because the REASONING is what stops someone adding a
  #      local tier back for "fast restores". It was a REQUIREMENT, not a
  #      preference: correcting the image removed the cause of these failures but
  #      not the leak MECHANISM. `filesystem` provisions a PVC per run and
  #      `keep:` prunes only successful backups, so any future transient failure
  #      — ENOSPC, a node eviction, a bad credential — starts filling the quota
  #      again. Object storage has no per-run PVC, so a failed run cannot leak a
  #      disk.
  #
  #      ⚠ And the leak did NOT self-clean. Verified 2026-09-14: those PVCs
  #      carried NO ownerReferences, so deleting the backup CR left the volume
  #      behind — `kubectl delete pxc-backup` freed nothing. An earlier note
  #      here said they cascaded. They did not. This is the part that made a
  #      local tier untenable rather than merely untidy.
  #
  #      Reclaim by hand, PODS FIRST. Deleting the backup CR also strands its
  #      retry pods, and while any of them exists the `kubernetes.io/pvc-protection`
  #      finalizer holds the PVC — so a `delete pvc` on its own just hangs,
  #      looking like a stuck finalizer when it is really a live reference:
  #          kubectl -n mimir delete pod -l percona.com/backup-name=<backup>
  #          kubectl -n mimir get pvc            # xb-<backup-name>-<stamp>
  #          kubectl -n mimir delete pvc <name>  # returns once the pods are gone
  #
  #      ⚠ HOMELAB IS NOT COVERED BY THIS. The bucket and endpoint above are
  #      GKE-specific. Garage is the homelab object store, and it is an
  #      in-cluster Service that does not resolve on GKE — so this cannot be one
  #      fixed value for both. Today this manifest is GKE-shaped; running the
  #      shared MySQL cluster on homelab needs the storage parameterised per
  #      environment first, the way nordri patches velero-gke vs velero-homelab.
  #      Left as a known limitation rather than a broken abstraction.
  #
    schedule:
      - name: daily
        schedule: "0 2 * * *"
        keep: 7
        storageName: gcs

  # NOTE: `gcs` is object storage OUTSIDE this cluster, so an engine-level backup
  # now survives losing the cluster — the exposure the Postgres cluster records,
  # and which consolidating every tenant onto one MySQL had concentrated from one
  # app onto all of them. Bucket is separate from Velero's and pgBackRest's on
  # purpose: different retention, different lifecycle, and a mistake in one
  # cannot reach the others.
  #
  # Velero's nightly volume snapshot remains a second, independent layer. It IS
  # working — verified 2026-09-14 in
  # velero-daily-full-20260914060008's volumeinfo: datadir-mimir-mysql-pxc-0,
  # method NativeSnapshot, result succeeded. (An older claim that Velero is not
  # operational survives in docs/plans/data-resiliency-plan.md; that document
  # predates 2026-09-01 and is banner-marked stale.)
  #
  # But a volume snapshot of a live database is CRASH-consistent, not
  # transaction-consistent — a disaster-recovery net, not a substitute for
  # xtrabackup. Restoring one is equivalent to recovering from a power cut.
  # Worth weighing before a second tenant joins XenForo here.
