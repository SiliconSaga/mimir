# The shared MySQL cluster.
#
# One cluster, many databases — vended by the DataService operator rather than
# by a claim per app. See docs/plans/2026-08-17-dataservice-vending-design.md.
#
# Declared as a plain manifest for the same reason as the Postgres cluster: it
# is infrastructure the platform owns, not something an app requests. A claim
# would imply it could be provisioned more than once, which is exactly the
# cluster-per-app model this replaces.
apiVersion: pxc.percona.com/v1
kind: PerconaXtraDBCluster
metadata:
  name: mimir-mysql
  namespace: mimir
spec:
  crVersion: 1.19.0
  # Required for pxc.size: 1. Galera is quorum-based and a one-node "cluster"
  # has no quorum, so the operator refuses the configuration without this flag.
  # See the size comment below for why the trade is taken deliberately.
  allowUnsafeConfigurations: true
  # The operator generates this Secret and keys it BY USERNAME — root, monitor,
  # xtrabackup — rather than carrying `user`/`password` the way Percona's
  # Postgres operator does. That is why the operator is pointed at it with
  # MIMIR_MYSQL_ADMIN_USER=root and ADMIN_PASSWORD_KEY defaulting to "root".
  secretsName: mimir-mysql-secrets

  pxc:
    # SINGLE NODE, and a stated limitation rather than an oversight — the same
    # trade the shared Postgres cluster documents, and slightly sharper here:
    # this is a single point of failure for every tenant on it, which is worse
    # than the per-app clusters it replaces, where one failure cost one app.
    # It also means the Galera replication that is PXC's entire reason for
    # existing is not actually doing anything yet.
    #
    # Deliberate for now, on a platform being actively de-contended. Raising to
    # 3 (Galera wants an odd number for quorum) is the fix, and it belongs with
    # the offsite-backup work below — both are prerequisites before anything
    # load-bearing depends on this cluster. Budget for it: three PXC nodes plus
    # HAProxy is roughly 4GB against this one's ~1.3GB.
    size: 1
    image: percona/percona-xtradb-cluster:8.0.44-35.1
    # Sized for the sum of its tenants plus connection overhead, in the same
    # spirit as the Postgres cluster. Deliberately not BestEffort: a pod with a
    # liveness probe and no requests is a restart loop under contention, and
    # this one holds every tenant's data.
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    volumeSpec:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Matches the Postgres cluster's 10Gi for the same reasoning: well
            # above current usage, and expandable on the storage classes this
            # platform runs, so growing later is a one-line change rather than
            # a migration.
            storage: 10Gi
    # No storageClassName, per the repo-wide rule: the cluster default is
    # local-path on k3d, standard-rwo on GKE, Longhorn on homelab.

  haproxy:
    # The consumer endpoint. MIMIR_MYSQL_HOST points here while
    # MIMIR_MYSQL_ADMIN_HOST may point at the same place — unlike Postgres,
    # MySQL DDL is not transactional, so there is no pooler-in-transaction-mode
    # problem forcing admin traffic to the primary.
    enabled: true
    size: 1
    image: percona/haproxy:2.8.17
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  backup:
    # ⚠ This tag does NOT track the operator version, and assuming it did is what
    # broke every backup this cluster ever attempted.
    #
    # `1.19.0-pxc8.0-backup-pxb8.0.35` was written by pattern-matching the
    # operator image (which really is 1.19.0). No such tag has ever existed:
    # Percona stopped publishing per-version backup images after 1.17.0, so the
    # 1.19.x line ships only `1.19.0` / `1.19.1` and their community bundles.
    # Confirmed against the Docker Hub tag list on 2026-09-14.
    #
    # Check the tag exists before bumping it. The failure is invisible from the
    # backup CR — see the schedule note below.
    #
    # ⚠ KNOWN SKEW, UNRESOLVED: this image carries xtrabackup 8.0.35 while
    # pxc.image above is server 8.0.44. PXB is normally expected to be >= the
    # server, and 8.0.35 is the newest 8.0-series build Percona publishes (the
    # standalone percona/percona-xtrabackup repo tops out there too). So this
    # may still fail — but it will now fail visibly, with an xtrabackup error
    # rather than an unexplained deadline. Verify one manual backup before
    # re-enabling the schedule.
    image: percona/percona-xtradb-cluster-operator:1.17.0-pxc8.0-backup-pxb8.0.35
    storages:
      local:
        type: filesystem
        volume:
          persistentVolumeClaim:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                # ⚠ This size is PER BACKUP RUN, not a shared pool. `type:
                # filesystem` provisions a NEW PVC of exactly this size for every
                # backup the schedule fires — the operator does not reuse one
                # volume and rotate inside it.
                #
                # 8Gi, sized against the 10Gi datadir. It was 40Gi on the
                # mistaken reading that retention shared one volume ("(3+1) x
                # 10Gi"), which instead provisioned 40Gi PER DAY.
                storage: 8Gi

  # ── SCHEDULE DISABLED 2026-09-14 ──
  # Commented rather than deleted so the intended shape survives. Re-enable only
  # after a manual backup actually reaches Succeeded.
  #
  # WHAT HAPPENED: it ran daily from 09-07 to 09-14 and EVERY run failed on the
  # bad image tag above, never starting xtrabackup at all. Each attempt still
  # provisioned its 40Gi PVC first, and `keep: 3` prunes successful backups, not
  # failed ones — so eight orphans reached 320Gi and took the regional
  # SSD_TOTAL_GB quota to 976 of 1000. Past that nothing cluster-wide could
  # provision a disk, and Velero surfaced it by going PartiallyFailed on the
  # PVCs that could no longer bind. Worse than no backup: nothing restorable,
  # and it consumed the quota everything else needed.
  #
  # ★ THE STATUS LIED, AND THAT IS THE DURABLE LESSON. The backup CR reported
  # "running deadline seconds exceeded", which reads as xtrabackup being slow on
  # a large dataset. It is really the operator timing out a job whose container
  # never pulled. Nothing in the CR, and nothing in the operator log a day
  # later, names the image. The cause is only visible in the backup POD's events
  # while it exists:
  #     kubectl -n mimir get pods -l percona.com/backup-name=<backup>
  #     kubectl -n mimir describe pod <that pod>
  # Do that first for any failing backup here, before tuning anything.
  #
  # BEFORE RE-ENABLING:
  #   1. Run ONE manual PerconaXtraDBClusterBackup and confirm state=Succeeded.
  #      The 8.0.35-vs-8.0.44 skew noted on the image is still unproven.
  #   2. Prefer S3 against Garage over `filesystem`. Object storage has no
  #      per-run PVC, so a failed run cannot leak a disk — and it is the offsite
  #      copy this lacks anyway.
  #
  # schedule:
  #   - name: daily
  #     schedule: "0 1 * * *"
  #     keep: 3
  #     storageName: local

  # NOTE: `local` is a PVC in this cluster. There is no offsite copy, so this
  # survives a pod restart but not the loss of the cluster — the same exposure
  # the Postgres cluster records, and consolidating concentrates it from one app
  # onto all of them. An S3 storage against Garage is the fix and belongs with
  # raising pxc.size above.
  #
  # ⚠ The shared MySQL cluster therefore has NO engine-level backup today.
  #
  # Its only protection is Velero's nightly volume snapshot. That IS working —
  # verified 2026-09-14 in velero-daily-full-20260914060008's volumeinfo:
  # datadir-mimir-mysql-pxc-0, method NativeSnapshot, result succeeded. (An
  # older claim that Velero is not operational survives in
  # docs/plans/data-resiliency-plan.md; that document predates 2026-09-01 and is
  # banner-marked stale.)
  #
  # But a volume snapshot of a live database is CRASH-consistent, not
  # transaction-consistent — a disaster-recovery net, not a substitute for
  # xtrabackup. Restoring one is equivalent to recovering from a power cut.
  # Worth weighing before a second tenant joins XenForo here.
